<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAB - Completar cadastro</title>
  <link rel="icon" type="image/png" href="/assets/favicon-D-HaqcHe.png">
  <script type="module" crossorigin src="/assets/completeProfile-C3kgd87L.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Btlm8H0F.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-VBRKn9At.js">
  <link rel="stylesheet" crossorigin href="/assets/global-ofpLf_5b.css">
</head>
<body class="complete-profile-page">
<div class="container auth-container">
  <div class="card auth-card">
    <div class="auth-intro">
      <span class="auth-eyebrow">Perfil do atleta</span>
      <h2>Complete seu cadastro</h2>
      <p class="auth-subtitle">Preencha seus dados para liberar o acesso aos torneios e as estastísticas.</p>
    </div>

    <div class="form-group">
      <label for="name">Nome completo</label>
      <input id="name" placeholder="Digite seu nome completo">
    </div>

    <div class="form-group">
      <label for="phone">Telefone</label>
      <input id="phone" placeholder="Digite seu telefone">
    </div>

    <div class="form-group">
      <label for="club">Clube</label>
      <input id="club" placeholder="Digite seu clube">
    </div>

    <div class="form-group">
      <label for="photoFile">Foto do perfil</label>
      <input id="photoFile" type="file" accept="image/*">
      <div class="photo-upload-hint">Você pode atualizar sua foto escolhendo uma nova imagem.</div>
      <div class="photo-preview-wrap">
        <img id="photoPreview" class="photo-preview" alt="Previa da foto" style="display:none">
        <div id="photoPreviewFallback" class="photo-preview photo-preview-fallback">Sem foto</div>
      </div>
    </div>

    <div class="form-group">
      <label for="category">Categoria</label>
      <select id="category">
        <option value="">Selecione uma categoria</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="Iniciante">Iniciante</option>
      </select>
    </div>

    <button  onclick="saveProfile()" style="margin-bottom: 15px;">
      Salvar</button>
    <button class="btn danger" onclick="logout()">Sair</button>
  </div>
</div>

</body>
</html>
