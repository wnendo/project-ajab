<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAB - Gerenciar Inscricoes</title>
  <link rel="icon" type="image/png" href="/assets/favicon-D-HaqcHe.png">
  <script type="module" crossorigin src="/assets/tournamentRegistrations-Bjay_IS_.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Btlm8H0F.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-VBRKn9At.js">
  <link rel="modulepreload" crossorigin href="/assets/confirm-modal-Dnnch5Ng.js">
  <link rel="modulepreload" crossorigin href="/assets/toast-kV3jSCF7.js">
  <link rel="modulepreload" crossorigin href="/assets/tournament-rules-CmdOaKKb.js">
  <link rel="stylesheet" crossorigin href="/assets/global-b_BAlAJ-.css">
</head>
<body class="profile-page">
  <div class="header">
    <img src="/assets/logo-D3xZMJos.png" class="logo-img">
    <div id="userSummary" class="user-summary"></div>
  </div>

  <div class="profile-shell management-shell">
    <section class="card profile-card">
      <span class="panel-tag">Pagamentos</span>
      <div class="section-header">
        <div>
          <span class="section-label">Torneio</span>
          <h1 id="registrationTournamentTitle">Carregando inscricoes...</h1>
        </div>
        <div class="profile-actions">
          <button class="btn secondary" onclick="goBackToTournament()">Voltar ao torneio</button>
          <button class="btn secondary" onclick="goToDashboard()">Hub</button>
          <button class="btn secondary" onclick="openProfile()">Perfil</button>
          <button class="btn primary" onclick="logout()">Sair</button>
        </div>
      </div>

      <p id="registrationTournamentSubtitle" class="profile-subtitle"></p>

      <div class="payment-summary">
        <div class="info-card">
          <span>Total de inscricoes</span>
          <strong id="registrationTotalCount">0</strong>
        </div>
        <div class="info-card">
          <span>Aguardando aprovação</span>
          <strong id="registrationPendingCount">0</strong>
        </div>
      </div>

      <input id="registrationSearch" placeholder="Pesquisar inscrições por nome, email, clube ou categoria" oninput="filterRegistrations()">

      <div class="registration-filters">
        <select id="registrationCategoryFilter" oninput="filterRegistrations()" style="display: none;">
          <option value="all">Todas as categorias</option>
          <option value="A">Categoria A</option>
          <option value="B">Categoria B</option>
          <option value="C">Categoria C</option>
          <option value="D">Categoria D</option>
          <option value="Iniciante">Iniciante</option>
        </select>
      </div>

      <div id="registrationList" class="stack-list"></div>
    </section>
  </div>

  <div id="approveRegistrationModal" class="modal">
    <div class="modal-card registration-modal-card">
      <div class="modal-header">
        <span>Aprovar pagamento</span>
        <button class="close-btn" onclick="closeApproveRegistrationModal()">Fechar</button>
      </div>
      <div class="modal-body registration-modal-body">
        <p id="approveRegistrationText" class="registration-modal-text"></p>
        <div id="approveRegistrationCategoryOptions" class="registration-category-list"></div>
        <p class="field-help">Você pode ajustar as categorias antes de aprovar o pagamento.</p>
        <div class="actions">
          <button class="btn primary" onclick="confirmApproveRegistration()">Confirmar aprovação</button>
          <button class="btn secondary" onclick="closeApproveRegistrationModal()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
