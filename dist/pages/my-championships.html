<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAB - Meus Torneios</title>
  <link rel="icon" type="image/png" href="/assets/favicon-D-HaqcHe.png">
  <script type="module" crossorigin src="/assets/myChampionships-C-Jbvc59.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Btlm8H0F.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-VBRKn9At.js">
  <link rel="modulepreload" crossorigin href="/assets/ranking-standings-Dec7PvHv.js">
  <link rel="modulepreload" crossorigin href="/assets/tournament-rules-Dalw4FyS.js">
  <link rel="stylesheet" crossorigin href="/assets/global-b_BAlAJ-.css">
</head>
<body class="profile-page">
  <div class="profile-shell">
    <header class="profile-hero">
      <div class="profile-hero-top">
        <div>
          <span class="profile-eyebrow">Acompanhamento</span>
          <h1>Meus torneios</h1>
          <p class="profile-subtitle">Acompanhe rankings e campeonatos em uma visao unica, com jogos em andamento, proximos confrontos e resultados.</p>
        </div>
        <div class="profile-actions">
          <button class="btn secondary" onclick="goBackToProfile()">Voltar ao perfil</button>
          <button class="btn danger" onclick="logout()">Sair</button>
        </div>
      </div>
    </header>

    <main>
      <section id="myChampionshipsList" class="stack-list"></section>
    </main>
  </div>

  <div id="tournamentCategoryChoiceModal" class="modal">
    <div class="modal-card athlete-activation-card">
      <div class="modal-header">
        <span>Escolha a categoria</span>
        <button class="close-btn" onclick="closeTournamentCategoryChoiceModal()">Fechar</button>
      </div>
      <div class="modal-body">
        <p id="tournamentCategoryChoiceText" class="registration-modal-text"></p>
        <div id="tournamentCategoryChoiceOptions" class="athlete-activation-actions"></div>
      </div>
    </div>
  </div>

  <div id="tournamentViewerModal" class="modal">
    <div class="modal-card tournament-viewer-modal-card">
      <div class="modal-header">
        <span id="tournamentViewerTitle">Visualizacao do torneio</span>
        <button class="close-btn" onclick="closeTournamentViewerModal()">Fechar</button>
      </div>
      <div id="tournamentViewerContent" class="modal-body registration-modal-body"></div>
    </div>
  </div>

</body>
</html>
