<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAB - Cadastro</title>
  <link rel="icon" type="image/png" href="/assets/favicon-D-HaqcHe.png">
  <script type="module" crossorigin src="/assets/register-BTE8gsI4.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Btlm8H0F.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-VBRKn9At.js">
  <link rel="stylesheet" crossorigin href="/assets/global-b_BAlAJ-.css">
</head>
<body class="register-page">
<div class="container auth-container register-container">
  <div class="card auth-card register-card">
    <div class="auth-intro">
      <span class="auth-eyebrow">Novo atleta</span>
      <h2>Cadastro</h2>
    </div>

    <div class="form-group">
      <label for="name">Nome completo</label>
      <input id="name" placeholder="Digite seu nome completo">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" placeholder="Digite seu email">
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Mínimo de 6 dígitos">
    </div>

    <div class="form-group">
      <label for="phone">Telefone</label>
      <input id="phone" placeholder="Digite seu telefone">
    </div>

    <div class="form-group">
      <label for="club">Clube</label>
      <input id="club" placeholder="Informe seu clube">
    </div>

    <div class="form-group">
      <label for="photoFile">Foto do perfil</label>
      <input id="photoFile" type="file" accept="image/*">
      <div class="photo-upload-hint">Escolha uma imagem leve para seu perfil.</div>
      <div class="photo-preview-wrap">
        <img id="photoPreview" class="photo-preview" alt="Previa da foto" style="display:none">
        <div id="photoPreviewFallback" class="photo-preview photo-preview-fallback">Sem foto</div>
      </div>
    </div>

    <div class="form-group">
      <label for="category">Categoria</label>
      <select id="category">
        <option value="">Selecione uma categoria</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="Iniciante">Iniciante</option>
      </select>
    </div>

    <button id="registerButton" class="register-submit" onclick="register()">Cadastrar</button>

    <p class="link" onclick="goToLogin()">Ja tenho conta</p>
  </div>
</div>

<div id="registerLoading" class="loading-overlay" aria-hidden="true">
  <div class="loading-card" role="status" aria-live="polite">
    <div class="spinner"></div>
    <p>Cadastrando suas informações...</p>
  </div>
</div>

</body>
</html>
