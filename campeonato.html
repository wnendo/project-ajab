<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- FONTES -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600&display=swap" rel="stylesheet">

<title>Ranking AJAB</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0b1220;
  color:#e5e7eb;
}

/* HEADER */
.header{
  background:#111827;
  padding:20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #1f2937;
}

/* LOGO */
.logo-icon{
  width:40px;
  height:40px;
  border-radius:10px;
  background:linear-gradient(135deg, #4a5e7e, #404f73);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:white;
}

.logo-text{
  font-family:'Poppins',sans-serif;
  font-size:20px;
}

/* LAYOUT */
.container{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:20px;
  padding:20px;
}

/* SIDEBAR */
.sidebar{
  background:#111827;
  padding:20px;
  border-radius:16px;
}

/* CARD */
.card{
  background:#111827;
  padding:20px;
  border-radius:16px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#1f2937;
  color:white;
  margin-top:8px;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#959fb0;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  background:#414f6e;
}

/* GRID */
.tables-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

/* MESA */
.match{
  background:#1f2937;
  padding:16px;
  border-radius:14px;
}

.free{
  background:#00f1ad21;
}

.playing{
  background:#1e3a8a2e;
}

/* PLAYERS */
.players{
  display:flex;
  justify-content:space-between;
  font-weight:600;
}

/* SCORE */
.score{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0;
}

.score input{
  width:60px;
  height:40px;
  text-align:center;
}

/* RANK */
.rank{
  display:flex;
  justify-content:space-between;
  padding:12px;
  border-radius:10px;
  background:#1f2937;
  margin-bottom:6px;
  cursor:pointer;
}

.rank:hover{
  background:#374151;
}

.rank-right{
  display:flex;
  gap:15px;
  font-size:13px;
}

/* HISTORY */
.details{
  font-size:12px;
  margin-left:10px;
  margin-bottom:8px;
}

/* RESULT */
.win{
  color:#22c55e;
  font-weight:bold;
}

.loss{
  color:#ef4444;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-icon">RK</div>
  <div class="logo-text">AJAB - Jimmy Chang</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>Jogadores</h3>
<input id="name" placeholder="Nome" onkeydown="handleEnter(event)">
<button onclick="addPlayer()">Adicionar</button>

<br><br>

<h3>Mesas</h3>
<input id="tablesInput" type="number" value="3" onchange="updateTables()">

<br><br>

<button onclick="restoreBackup()">Restaurar Backup</button>
<button onclick="resetAll()">Reset</button>

<input type="file" id="fileInput" style="display:none" onchange="loadBackup(event)">

</div>

<!-- MAIN -->
<div>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="ranking"></div>
</div>

<br>

<div class="card">
<h3>🏓 Mesas</h3>
<div id="tables"></div>
</div>

</div>

</div>

<script>
let players=[]
let tables=[]

function handleEnter(e){
  if(e.key==="Enter") addPlayer()
}

function backup(){
  const data={players,tables}

  // salva local
  localStorage.setItem("backup",JSON.stringify(data))

  // cria arquivo com timestamp
  const now=new Date()
  const name=`backup_${now.toISOString().replace(/[:.]/g,'-')}.json`

  const blob=new Blob([JSON.stringify(data,null,2)])
  const a=document.createElement("a")
  a.href=URL.createObjectURL(blob)
  a.download=name
  a.click()
}

function autoRestore(){
  const saved=localStorage.getItem("backup")
  if(saved){
    const data=JSON.parse(saved)
    players=data.players||[]
    tables=data.tables||[]
  }
}

function addPlayer(){
  let name=document.getElementById("name").value
  if(!name) return

  players.push({
    name,
    wins:0,
    losses:0,
    games:0,
    played:[],
    history:[],
    lastPlayed:0
  })

  document.getElementById("name").value=""
  render()
  backup()
}

function updateTables(){
  let n=parseInt(document.getElementById("tablesInput").value)

  while(tables.length<n) tables.push({p1:null,p2:null})
  while(tables.length>n) tables.pop()

  render()
}

function getBusy(){
  let b=new Set()
  tables.forEach(t=>{
    if(t.p1) b.add(t.p1.name)
    if(t.p2) b.add(t.p2.name)
  })
  return b
}

function getNext(){
  let busy=getBusy()

  let sorted=[...players].sort((a,b)=>
    a.games-b.games ||
    a.lastPlayed-b.lastPlayed ||
    b.wins-a.wins
  )

  for(let i=0;i<sorted.length;i++){
    if(busy.has(sorted[i].name)) continue
    for(let j=i+1;j<sorted.length;j++){
      if(!busy.has(sorted[j].name)){
        return [sorted[i],sorted[j]]
      }
    }
  }
}

function fill(i){
  let m=getNext()
  if(!m) return
  tables[i]={p1:m[0],p2:m[1]}
  render()
}

function finish(i){
  let t=tables[i]

  let s1=parseInt(document.getElementById(`s1_${i}`).value)
  let s2=parseInt(document.getElementById(`s2_${i}`).value)

  if(s1===s2) return

  let w=s1>s2?t.p1:t.p2
  let l=s1>s2?t.p2:t.p1

  w.wins++
  l.losses++

  t.p1.games++
  t.p2.games++

  t.p1.history.push({opponent:t.p2.name,result:s1>s2?"W":"L",score:`${s1}x${s2}`})
  t.p2.history.push({opponent:t.p1.name,result:s2>s1?"W":"L",score:`${s2}x${s1}`})

  tables[i]={p1:null,p2:null}

  render()
  backup()
}

function renderRanking(){
  let sorted=[...players].sort((a,b)=>b.wins-a.wins)

  document.getElementById("ranking").innerHTML=
    sorted.map((p,i)=>`
      <div class="rank" onclick="toggle('${p.name}')">
        <div>${i+1}. ${p.name}</div>
        <div class="rank-right">
          <span>W:${p.wins}</span>
          <span>L:${p.losses}</span>
          <span>J:${p.games}</span>
        </div>
      </div>

      <div id="d_${p.name}" class="details" style="display:none;">
        ${p.history.map(h=>`
          <div>
            vs ${h.opponent} →
            <span class="${h.result==="W"?"win":"loss"}">
              ${h.result}
            </span>
            (${h.score})
          </div>
        `).join("")}
      </div>
    `).join("")
}

function toggle(name){
  let el=document.getElementById("d_"+name)
  el.style.display=el.style.display==="none"?"block":"none"
}

function render(){
  renderRanking()

  document.getElementById("tables").innerHTML=
    `<div class="tables-grid">
      ${tables.map((t,i)=>`
        <div class="match ${t.p1?'playing':'free'}">

          ${t.p1 ? `
            <div class="players">
              <span>${t.p1.name}</span>
              <span>${t.p2.name}</span>
            </div>

            <div class="score">
              <input id="s1_${i}" value="0">
              x
              <input id="s2_${i}" value="0">
            </div>

            <button onclick="finish(${i})">Finalizar</button>
          ` : `
            Livre
            <button onclick="fill(${i})">Iniciar jogo</button>
          `}
        </div>
      `).join("")}
    </div>`
}

function restoreBackup(){
  document.getElementById("fileInput").click()
}

function loadBackup(e){
  const file=e.target.files[0]
  const reader=new FileReader()
  reader.onload=function(ev){
    const data=JSON.parse(ev.target.result)
    players=data.players||[]
    tables=data.tables||[]
    render()
  }
  reader.readAsText(file)
}

function resetAll(){
  if(!confirm("Resetar tudo?")) return
  players=[]
  tables=[]
  localStorage.removeItem("backup")
  render()
}

autoRestore()
updateTables()
render()
</script>

</body>
</html>
